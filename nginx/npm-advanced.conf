# Nginx Proxy Manager -> proxy host -> Advanced tab
# The upstream block lives in http_top.conf; see README.md here.

# A two hour episode is roughly 250 MB as 16 kHz mono WAV.
client_max_body_size 2048m;

# Long files decode for minutes; queued requests wait longer.
proxy_read_timeout    900s;
proxy_send_timeout    900s;
proxy_connect_timeout 30s;

access_log /var/log/nginx/whisper_access.log;
error_log  /var/log/nginx/whisper_error.log warn;

location / {
    proxy_pass http://whisper_pool;
    proxy_http_version 1.1;

    # nginx buffers the whole body to disk by default, which adds latency
    # and hides the connection from least_conn.
    proxy_request_buffering off;

    # Required for upstream keepalive.
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do NOT add non_idempotent. Replaying a started transcription
    # doubles the GPU work.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
}
}
