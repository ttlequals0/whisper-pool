# Nginx Proxy Manager -> proxy host -> Advanced tab
#
# The name in proxy_pass below must match the upstream in http_top.conf. They
# are a pair: install both, or neither. Pasting this against an http_top.conf
# that names the upstream something else fails the nginx config test, and NPM
# then renders no server block at all, so the host 404s.
#
# Do not add access_log or error_log here. NPM writes its own
# /data/logs/proxy-host-N_*.log lines, and a second directive replaces them.

# A two hour episode is roughly 250 MB as 16 kHz mono WAV.
client_max_body_size 2048m;

# Long files decode for minutes; queued requests wait longer.
proxy_read_timeout    900s;
proxy_send_timeout    900s;
proxy_connect_timeout 30s;

location / {
    proxy_pass http://whisper_pool;
    proxy_http_version 1.1;

    # nginx buffers the whole body to disk by default, which adds latency
    # and hides the connection from least_conn.
    proxy_request_buffering off;

    # verbose_json with word timestamps runs 130 to 180 KB for a ten
    # minute chunk, well past the default 32 KB of proxy buffers, so every
    # response spilled to proxy_temp on disk. 512 KB covers that in memory.
    # Response buffering stays ON: with it off nginx holds the upstream
    # connection until the client has read everything, and least_conn
    # balances on connection count, so a slow client would skew routing.
    proxy_buffer_size 16k;
    proxy_buffers     32 16k;

    # Required for upstream keepalive.
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do NOT add non_idempotent. Replaying a started transcription
    # doubles the GPU work.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
}
