# Vanilla nginx: load balance three whisper replicas on one host.
# Drop into /etc/nginx/conf.d/whisper-pool.conf and reload.
#
# Replace whisper.example.com and the certificate paths. If the replicas run on
# the same host as nginx, 127.0.0.1 works; across hosts, use their addresses.

upstream whisper_pool {
    # zone is REQUIRED. Without it, least_conn state is per nginx worker and
    # each worker independently picks the first server in the list, so all
    # traffic lands on one replica and it looks like the upstream is ignored.
    zone whisper_pool 64k;

    # least_conn, not round robin. Each replica serves one decode at a time and
    # requests range from under a second to several minutes, so connection count
    # is a direct read on which replica is free.
    least_conn;

    server 127.0.0.1:9002 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:9003 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:9004 max_fails=2 fail_timeout=30s;

    # Audio uploads are large and frequent; a TCP handshake per request is
    # pure overhead.
    keepalive 16;
    keepalive_timeout 300s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whisper.example.com;

    ssl_certificate     /etc/letsencrypt/live/whisper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whisper.example.com/privkey.pem;

    # A two hour episode is roughly 250 MB as 16 kHz mono WAV.
    client_max_body_size 2048m;

    # A long file can decode for minutes, and a queued request waits behind
    # whatever is ahead of it.
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
    proxy_connect_timeout 30s;

    access_log /var/log/nginx/whisper_access.log;
    error_log  /var/log/nginx/whisper_error.log warn;

    location / {
        proxy_pass http://whisper_pool;
        proxy_http_version 1.1;

        # Stream the upload straight through. By default nginx buffers the whole
        # body to disk first, which adds latency on every request and delays
        # least_conn from seeing the connection.
        proxy_request_buffering off;

        # Required for upstream keepalive.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail over on connect and timeout errors only. Do NOT add
        # non_idempotent: replaying a transcription that already started
        # doubles the GPU work for no benefit.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name whisper.example.com;
    return 301 https://$host$request_uri;
}
