# Vanilla nginx: load balance three whisper replicas on one host.
# Drop into /etc/nginx/conf.d/whisper-pool.conf and reload.
#
# Replace whisper.example.com and the certificate paths. If the replicas run on
# the same host as nginx, 127.0.0.1 works; across hosts, use their addresses.

upstream whisper_pool {
    # REQUIRED. Without it least_conn state is per worker, so every worker
    # picks the first server and all traffic lands on one replica.
    zone whisper_pool 64k;

    # Requests range from under a second to minutes, so connection count is
    # the best read on which replica is free. Round robin is not.
    least_conn;

    server 127.0.0.1:9002 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:9003 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:9004 max_fails=2 fail_timeout=30s;

    # Uploads are large and frequent; skip a handshake per request.
    keepalive 16;
    keepalive_timeout 300s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whisper.example.com;

    ssl_certificate     /etc/letsencrypt/live/whisper.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whisper.example.com/privkey.pem;

    # A two hour episode is roughly 250 MB as 16 kHz mono WAV.
    client_max_body_size 2048m;

    # Long files decode for minutes; queued requests wait longer.
    proxy_read_timeout    900s;
    proxy_send_timeout    900s;
    proxy_connect_timeout 30s;

    access_log /var/log/nginx/whisper_access.log;
    error_log  /var/log/nginx/whisper_error.log warn;

    location / {
        proxy_pass http://whisper_pool;
        proxy_http_version 1.1;

        # nginx buffers the whole body to disk by default, which adds latency
        # and hides the connection from least_conn.
        proxy_request_buffering off;

        # verbose_json with word timestamps runs 130 to 180 KB for a ten
        # minute chunk, well past the default 32 KB of proxy buffers, so every
        # response spilled to proxy_temp on disk. 512 KB covers that in memory.
        # Response buffering stays ON: with it off nginx holds the upstream
        # connection until the client has read everything, and least_conn
        # balances on connection count, so a slow client would skew routing.
        proxy_buffer_size 16k;
        proxy_buffers     32 16k;

        # Required for upstream keepalive.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT add non_idempotent. Replaying a started transcription
        # doubles the GPU work.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name whisper.example.com;
    return 301 https://$host$request_uri;
}
